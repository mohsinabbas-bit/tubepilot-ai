<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TubePilot AI — Team Approve</title>
  <link rel="icon" href="../favicon.png" />
  <link rel="stylesheet" href="../site.css" />
  <style>
    body { min-height: 100vh; background: radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,.25), transparent), var(--bg); }
    .approve-wrap { width: min(720px, calc(100% - 32px)); margin: 96px auto 48px; }
    .approve-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px; margin-bottom: 14px; }
    .approve-card h1 { font-size: 1.35rem; margin-bottom: 6px; }
    .meta { color: var(--muted); font-size: .85rem; margin-bottom: 14px; }
    label { display: block; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 6px; }
    input, textarea { width: 100%; background: #0c0c14; border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 10px 12px; font: inherit; }
    textarea { min-height: 110px; resize: vertical; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .btn { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
    .btn-ok { background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; }
    .btn-no { background: rgba(239,68,68,.15); color: #fca5a5; }
    .score { font-size: .85rem; color: #a5b4fc; }
    .banner { padding: 12px 14px; border-radius: 12px; margin-bottom: 16px; font-size: .9rem; }
    .banner.err { background: rgba(239,68,68,.12); color: #fecaca; border: 1px solid rgba(239,68,68,.25); }
    .banner.ok { background: rgba(34,197,94,.12); color: #bbf7d0; border: 1px solid rgba(34,197,94,.25); }
    .empty { text-align: center; color: var(--muted); padding: 40px 12px; }
  </style>
</head>
<body>
  <div class="approve-wrap">
    <div class="approve-card">
      <h1>Team Approve</h1>
      <p class="meta">Review pending TubePilot videos from your Agency invite link. Approving tells the owner’s app to upload.</p>
      <div id="status"></div>
    </div>
    <div id="list"></div>
  </div>
  <script src="./config.js"></script>
  <script src="./approve.js"></script>
</body>
</html>
